<!doctype html>
<!-- Spring Trophy web canlı izleme (2D): koyu "yayın" temalı MapLibre haritası.
     Build aracı yok; maplibre-gl CDN'den gelir, mantık app.js'te. -->
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spring Trophy — Canlı İzleme</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
  <style>
    /* Tasarım değişkenleri tek yerde — bileşenler renk hard-code etmez */
    :root {
      --zemin: #0a0f14;
      --panel: rgba(13, 20, 28, 0.86);
      --panel-kenar: rgba(255, 255, 255, 0.08);
      --metin: #e8eef5;
      --metin-soluk: #8fa0b3;
      --vurgu: #35c3f0;
      --sancak: #22c55e;  /* denizcilik: sancak kontra = yeşil */
      --iskele: #ef4444;  /* denizcilik: iskele kontra = kırmızı */
      --canli: #22c55e;   /* bağlantı rozeti: canlı */
      --bekliyor: #f59e0b; /* bağlantı rozeti: bağlanıyor */
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--zemin);
      color: var(--metin);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #harita { position: fixed; inset: 0; }

    /* Yayın başlığı: haritanın üstünde yüzen panel */
    #baslik {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      padding: 10px 16px;
      background: var(--panel);
      border: 1px solid var(--panel-kenar);
      border-radius: 10px;
      backdrop-filter: blur(6px);
    }
    #baslik h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }
    #baslik p {
      margin: 2px 0 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--metin-soluk);
      text-transform: uppercase;
    }

    /* Bağlantı durumu rozeti */
    #rozet {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    #rozet::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    #rozet.canli { color: var(--canli); background: color-mix(in srgb, var(--canli) 15%, transparent); }
    #rozet.bekliyor { color: var(--bekliyor); background: color-mix(in srgb, var(--bekliyor) 15%, transparent); }

    /* Rüzgar göstergesi (HUD) */
    #ruzgar {
      position: fixed;
      bottom: 24px;
      left: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--panel);
      border: 1px solid var(--panel-kenar);
      border-radius: 10px;
      backdrop-filter: blur(6px);
    }
    #ruzgar-ok {
      width: 28px;
      height: 28px;
      color: var(--vurgu);
      transition: transform 0.6s ease; /* rüzgar dönüşü yumuşak */
    }
    #ruzgar .etiket {
      margin: 0;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--metin-soluk);
    }
    #ruzgar-deger {
      margin: 1px 0 0;
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Tekne kartı: tıklanan teknenin canlı SOG/COG bilgisi */
    #kart {
      position: fixed;
      right: 16px;
      bottom: 48px; /* atıf çubuğunun üstünde */
      z-index: 10;
      min-width: 180px;
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--panel-kenar);
      border-radius: 10px;
      backdrop-filter: blur(6px);
    }
    .kart-baslik {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .kart-baslik h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    #kart-kapat {
      width: 44px;   /* dokunma hedefi ≥44pt */
      height: 44px;
      margin: -10px -12px -10px 0;
      border: none;
      background: none;
      color: var(--metin-soluk);
      font-size: 16px;
      cursor: pointer;
    }
    #kart-kapat:hover { color: var(--metin); }
    .kart-satirlar {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 14px;
      margin-top: 8px;
    }
    .kart-satirlar .etiket {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--metin-soluk);
      align-self: center;
    }
    .kart-satirlar .deger {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    #kart-kontra.sancak { color: var(--sancak); }
    #kart-kontra.iskele { color: var(--iskele); }
  </style>
</head>
<body>
  <div id="harita"></div>
  <header id="baslik">
    <h1>SPRING TROPHY</h1>
    <p>Canlı Yarış İzleme</p>
    <span id="rozet" class="bekliyor">BAĞLANIYOR</span>
  </header>

  <!-- Tekne kartı: teknelere tıklayınca açılır, her karede canlı güncellenir -->
  <aside id="kart" hidden>
    <div class="kart-baslik">
      <h2 id="kart-tekne">—</h2>
      <button id="kart-kapat" aria-label="Kartı kapat">✕</button>
    </div>
    <div class="kart-satirlar">
      <span class="etiket">SOG</span><span class="deger" id="kart-sog">—</span>
      <span class="etiket">COG</span><span class="deger" id="kart-cog">—</span>
      <span class="etiket">KONTRA</span><span class="deger" id="kart-kontra">—</span>
    </div>
  </aside>

  <!-- Rüzgar oku: akış yönünü gösterir (rüzgarın estiği yön + 180°) -->
  <div id="ruzgar" hidden>
    <svg id="ruzgar-ok" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 1 L18.5 21 L12 16.6 L5.5 21 Z" />
    </svg>
    <div>
      <p class="etiket">RÜZGAR</p>
      <p id="ruzgar-deger">—</p>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="interp.js"></script>
  <script src="app.js"></script>
</body>
</html>
